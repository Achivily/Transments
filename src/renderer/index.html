<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transments</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">T</div>
        <div>
          <h1>Transments</h1>
          <p>Image Converter</p>
        </div>
      </div>

      <section class="panel source-panel">
        <div class="panel-title">
          <span>来源</span>
          <span id="sourceBadge" class="badge">空</span>
        </div>
        <div class="stack">
          <button id="pickImagesBtn" class="primary-action" type="button">选择图片</button>
          <button id="pickFolderBtn" class="ghost-action" type="button">选择文件夹</button>
        </div>
        <label class="field">
          <span>仅扫描</span>
          <select id="formatFilter">
            <option value="auto">全部图片</option>
            <option value=".png">PNG</option>
            <option value=".jpg">JPG / JPEG</option>
            <option value=".webp">WebP</option>
            <option value=".tif">TIFF</option>
            <option value=".avif">AVIF</option>
            <option value=".gif">GIF</option>
            <option value=".bmp">BMP</option>
            <option value=".heic">HEIC / HEIF</option>
          </select>
        </label>
        <label class="check-row">
          <input id="recursiveScan" type="checkbox">
          <span>包含子文件夹</span>
        </label>
      </section>

      <section class="panel settings-panel">
        <div class="panel-title">输出</div>
        <label class="field">
          <span>格式</span>
          <select id="outputFormat">
            <option value="png">PNG</option>
            <option value="webp">WebP Lossless</option>
            <option value="avif">AVIF Lossless</option>
            <option value="gif">GIF</option>
            <option value="bmp">BMP</option>
            <option value="tiff">TIFF</option>
            <option value="jpeg">JPEG 100</option>
            <option value="heic">HEIC</option>
          </select>
        </label>
        <label class="check-row">
          <input id="lossless" type="checkbox" checked>
          <span>优先无损编码</span>
        </label>
        <label class="check-row">
          <input id="overwrite" type="checkbox">
          <span>覆盖同名文件</span>
        </label>
        <button id="pickOutputBtn" class="ghost-action" type="button">指定输出位置</button>
        <div id="outputDir" class="path-chip">未选择</div>
      </section>
    </aside>

    <section class="workspace">
      <header class="topbar">
        <div>
          <h2>批量转换</h2>
          <p id="folderPath">等待选择来源</p>
        </div>
        <div class="toolbar">
          <button id="rescanBtn" class="icon-button" title="重新扫描" type="button" disabled>↻</button>
          <button id="clearBtn" class="icon-button" title="清空队列" type="button" disabled>×</button>
        </div>
      </header>

      <section class="metrics">
        <div>
          <span>队列</span>
          <strong id="totalCount">0</strong>
        </div>
        <div>
          <span>完成</span>
          <strong id="doneCount">0</strong>
        </div>
        <div>
          <span>失败</span>
          <strong id="failCount">0</strong>
        </div>
      </section>

      <section class="queue-area">
        <div id="emptyState" class="empty-state">
          <strong>选择图片或文件夹</strong>
          <span>PNG、JPEG、WebP、TIFF、AVIF、GIF、BMP、HEIC</span>
        </div>
        <div id="fileList" class="file-list" aria-live="polite"></div>
      </section>

      <footer class="actionbar">
        <div class="progress-wrap">
          <div class="progress-track">
            <div id="progressBar" class="progress-bar"></div>
          </div>
          <span id="statusText">准备就绪</span>
        </div>
        <div class="action-buttons">
          <button id="cancelBtn" class="ghost-action" type="button" disabled>取消</button>
          <button id="convertBtn" class="primary-action" type="button" disabled>开始转换</button>
        </div>
      </footer>
    </section>
  </main>
  <script src="./renderer.js"></script>
</body>
</html>
