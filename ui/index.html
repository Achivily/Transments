<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transments</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-photo" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="9" cy="10" r="1.6" fill="currentColor"/><path d="M4.5 17l4.6-4.6a1.4 1.4 0 0 1 2 0L15 16.3l1.6-1.6a1.4 1.4 0 0 1 2 0l1.9 1.9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
    <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M10 9.2v5.6l4.8-2.8z" fill="currentColor"/></symbol>
    <symbol id="i-compress" viewBox="0 0 24 24"><path d="M12 3.5v6m0 0L9 6.5m3 3l3-3M12 20.5v-6m0 0l-3 3m3-3l3 3M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-folder"viewBox="0 0 24 24"><path d="M3.5 7.5A2.5 2.5 0 0 1 6 5h3.3c.6 0 1.2.3 1.6.7L12.3 7H18a2.5 2.5 0 0 1 2.5 2.5v7A2.5 2.5 0 0 1 18 19H6a2.5 2.5 0 0 1-2.5-2.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.05-4.95M19 5v4h-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 7V5.5h4V7M7 7l.8 11a1.5 1.5 0 0 0 1.5 1.4h5.4a1.5 1.5 0 0 0 1.5-1.4L17 7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5.5 12.5l4 4 9-9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-xmark" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-chevrons" viewBox="0 0 24 24"><path d="M8.5 9.5L12 6l3.5 3.5M8.5 14.5L12 18l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-arrow-out" viewBox="0 0 24 24"><path d="M14 5h5v5M19 5l-8 8M17 14v3.5A1.5 1.5 0 0 1 15.5 19h-9A1.5 1.5 0 0 1 5 17.5v-9A1.5 1.5 0 0 1 6.5 7H10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-tray" viewBox="0 0 24 24"><path d="M12 4v10m0 0l-4-4m4 4l4-4M4 14v3.5A2.5 2.5 0 0 0 6.5 20h11a2.5 2.5 0 0 0 2.5-2.5V14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 4a8 8 0 1 0 0 16c1.1 0 1.7-.7 1.7-1.5 0-1.2-1-1.5-1-2.6 0-.9.7-1.6 1.6-1.6H16a4 4 0 0 0 4-4C20 6.9 16.4 4 12 4z" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="8" cy="11" r="1.2" fill="currentColor"/><circle cx="10.5" cy="7.8" r="1.2" fill="currentColor"/><circle cx="14.5" cy="7.8" r="1.2" fill="currentColor"/></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 4.5l8.5 15h-17z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 10v4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><circle cx="12" cy="16.8" r="1.1" fill="currentColor"/></symbol>
  </svg>

  <div class="window" id="window">
    <header class="titlebar" data-tauri-drag-region>
      <div class="traffic" id="traffic">
        <button class="light close" id="winClose" type="button" data-i18n-title="close"><svg viewBox="0 0 12 12"><path d="M3.5 3.5l5 5M8.5 3.5l-5 5"/></svg></button>
        <button class="light min" id="winMin" type="button" data-i18n-title="minimize"><svg viewBox="0 0 12 12"><path d="M2.8 6h6.4"/></svg></button>
        <button class="light max" id="winMax" type="button" data-i18n-title="zoom"><svg viewBox="0 0 12 12"><path d="M3.6 3.6h3.6l-3.6 3.6zM8.4 8.4H4.8l3.6-3.6z" class="fill"/></svg></button>
      </div>
      <div class="title-brand" data-tauri-drag-region>
        <img class="brand-icon" src="./icon.png" alt="" data-tauri-drag-region>
        <span class="brand-name" data-tauri-drag-region>Transments</span>
      </div>
      <div class="segmented mode-switch" id="modeSwitch" role="tablist">
        <span class="seg-thumb"></span>
        <button class="seg" type="button" role="tab" data-value="image"><svg><use href="#i-photo"/></svg><span data-i18n="modeImages">Images</span></button>
        <button class="seg" type="button" role="tab" data-value="video"><svg><use href="#i-film"/></svg><span data-i18n="modeVideos">Videos</span></button>
        <button class="seg" type="button" role="tab" data-value="compress"><svg><use href="#i-compress"/></svg><span data-i18n="modeCompress">Compress</span></button>
      </div>
      <div class="title-actions">
        <button id="languageBtn" class="pill-button" type="button" data-i18n-title="switchLanguage"><span id="languageLabel">中文</span></button>
        <button id="appearanceBtn" class="icon-button" type="button" data-i18n-title="appearance"><svg><use href="#i-palette"/></svg></button>
      </div>
    </header>

    <div class="pages" id="pages"></div>
  </div>

  <div class="popover" id="appearancePopover" hidden>
    <div class="popover-head">
      <strong data-i18n="accentColor">Accent Color</strong>
      <span id="accentName" class="popover-meta"></span>
    </div>
    <div class="swatches" id="swatches"></div>
    <div class="popover-label" data-i18n="accentVariant">Tone</div>
    <div class="segmented small" id="variantSwitch">
      <span class="seg-thumb"></span>
      <button class="seg" type="button" data-value="0"><span data-i18n="variantStandard">Standard</span></button>
      <button class="seg" type="button" data-value="1"><span data-i18n="variantVibrant">Vibrant</span></button>
      <button class="seg" type="button" data-value="2"><span data-i18n="variantDeep">Deep</span></button>
      <button class="seg" type="button" data-value="3"><span data-i18n="variantSoft">Soft</span></button>
    </div>
  </div>

  <div class="menu-layer" id="menuLayer"></div>

  <template id="pageTemplate">
    <section class="page">
      <aside class="sidebar scroll">
        <div class="ffmpeg-card card" data-role="ffmpegCard" hidden>
          <div class="ffmpeg-head"><svg><use href="#i-warn"/></svg><strong data-i18n="ffmpegMissing">FFmpeg not found</strong></div>
          <p data-i18n="ffmpegMissingHint"></p>
          <button class="btn small" type="button" data-role="ffmpegRecheck" data-i18n="ffmpegRecheck">Check Again</button>
        </div>

        <section class="card">
          <div class="card-title">
            <span data-i18n="sourceTitle">Source</span>
            <span class="badge" data-role="sourceBadge">Empty</span>
          </div>
          <div class="button-pair">
            <button class="btn primary" type="button" data-role="pickFiles"><svg><use href="#i-plus"/></svg><span data-role="pickFilesLabel"></span></button>
            <button class="btn" type="button" data-role="pickFolder"><svg><use href="#i-folder"/></svg><span data-i18n="chooseFolder">Choose Folder</span></button>
          </div>
          <div class="row">
            <span class="row-label" data-i18n="scanFilter">Scan Filter</span>
            <div class="popup" data-role="formatFilter"></div>
          </div>
          <label class="row switch-row">
            <span class="row-label" data-i18n="includeSubfolders">Include Subfolders</span>
            <input type="checkbox" class="switch" data-role="recursive">
          </label>
        </section>

        <section class="card">
          <div class="card-title"><span data-i18n="outputTitle">Output</span><span class="caption" data-role="ffmpegVersion"></span></div>
          <div class="section-label" data-i18n="presetTitle">Presets</div>
          <div class="preset-grid" data-role="presets"></div>
          <div class="row">
            <span class="row-label" data-i18n="formatLabel">Format</span>
            <div class="popup" data-role="outputFormat"></div>
          </div>
          <div class="row stacked" data-role="targetRow" hidden>
            <span class="row-label" data-i18n="targetSize">Target Size</span>
            <div class="segmented small" data-role="targetMode">
              <span class="seg-thumb"></span>
              <button class="seg" type="button" data-value="ratio"><span data-i18n="targetByRatio">Percent of Original</span></button>
              <button class="seg" type="button" data-value="size"><span data-i18n="targetBySize">Exact Size</span></button>
            </div>
            <div class="segmented small" data-role="ratio">
              <span class="seg-thumb"></span>
              <button class="seg" type="button" data-value="0.7"><span>70%</span></button>
              <button class="seg" type="button" data-value="0.5"><span>50%</span></button>
              <button class="seg" type="button" data-value="0.3"><span>30%</span></button>
              <button class="seg" type="button" data-value="0.2"><span>20%</span></button>
            </div>
            <div class="size-field" data-role="sizeField" hidden>
              <label class="number-input"><input type="number" min="0.1" step="any" inputmode="decimal" data-role="sizeInput" value="25"><span>MB</span></label>
              <div class="chips" data-role="sizeChips">
                <button class="chip" type="button" data-value="10">10</button>
                <button class="chip" type="button" data-value="25">25</button>
                <button class="chip" type="button" data-value="50">50</button>
                <button class="chip" type="button" data-value="100">100</button>
                <button class="chip" type="button" data-value="500">500</button>
              </div>
            </div>
          </div>
          <div class="row stacked" data-role="codecRow" hidden>
            <span class="row-label"><span data-i18n="codecLabel">Encoder</span><small data-i18n="codecHint"></small></span>
            <div class="segmented small" data-role="codec">
              <span class="seg-thumb"></span>
              <button class="seg" type="button" data-value="hevc"><span data-i18n="codecHevc">H.265 Smaller</span></button>
              <button class="seg" type="button" data-value="h264"><span data-i18n="codecH264">H.264 Compatible</span></button>
            </div>
          </div>
          <p class="note" data-role="compressNote" data-i18n="compressNote" hidden></p>
          <div class="row stacked" data-role="qualityRow" hidden>
            <span class="row-label" data-i18n="qualityLabel">Quality</span>
            <div class="segmented small" data-role="quality">
              <span class="seg-thumb"></span>
              <button class="seg" type="button" data-value="high"><span data-i18n="qualityHigh">High</span></button>
              <button class="seg" type="button" data-value="balanced"><span data-i18n="qualityBalanced">Balanced</span></button>
              <button class="seg" type="button" data-value="small"><span data-i18n="qualitySmall">Small</span></button>
            </div>
          </div>
          <label class="row switch-row" data-role="losslessRow">
            <span class="row-label" data-i18n="preferLossless">Prefer Lossless Encoding</span>
            <input type="checkbox" class="switch" data-role="lossless" checked>
          </label>
          <label class="row switch-row" data-role="smartCopyRow" hidden>
            <span class="row-label"><span data-i18n="smartCopy">Smart Passthrough</span><small data-i18n="smartCopyHint"></small></span>
            <input type="checkbox" class="switch" data-role="smartCopy" checked>
          </label>
          <label class="row switch-row">
            <span class="row-label" data-i18n="overwriteExisting">Overwrite Existing Files</span>
            <input type="checkbox" class="switch" data-role="overwrite">
          </label>
          <div class="section-label" data-i18n="outputFolder">Output Folder</div>
          <button class="path-button" type="button" data-role="pickOutput">
            <svg><use href="#i-folder"/></svg>
            <span class="path-text" data-role="outputDir">Not selected</span>
            <span class="path-action" data-i18n="chooseOutputFolder">Choose Output Folder</span>
          </button>
        </section>
      </aside>

      <main class="workspace">
        <header class="workspace-head">
          <div class="workspace-title">
            <h2 data-role="heading"></h2>
            <p data-role="sourcePath">Waiting for source</p>
          </div>
          <div class="toolbar">
            <button class="icon-button" type="button" data-role="rescan" data-i18n-title="rescan" disabled><svg><use href="#i-refresh"/></svg></button>
            <button class="icon-button" type="button" data-role="clear" data-i18n-title="clearQueue" disabled><svg><use href="#i-trash"/></svg></button>
          </div>
        </header>

        <section class="metrics">
          <div class="metric"><span data-i18n="queued">Queued</span><strong data-role="totalCount">0</strong></div>
          <div class="metric ok"><span data-i18n="doneMetric">Done</span><strong data-role="doneCount">0</strong></div>
          <div class="metric bad"><span data-i18n="failedMetric">Failed</span><strong data-role="failCount">0</strong></div>
        </section>

        <section class="queue card" data-role="queue">
          <div class="empty-state" data-role="emptyState">
            <div class="empty-icon"><svg data-role="emptyIcon"><use href="#i-photo"/></svg></div>
            <strong data-role="emptyTitle"></strong>
            <span data-role="emptyHint"></span>
          </div>
          <div class="file-list scroll" data-role="fileList" aria-live="polite"></div>
          <div class="drop-overlay" data-role="dropOverlay">
            <div class="drop-frame">
              <svg><use href="#i-tray"/></svg>
              <strong data-role="dropTitle"></strong>
              <span data-i18n="dropHint">The current scan filter and subfolder option will be used.</span>
            </div>
          </div>
        </section>

        <section class="result card" data-role="resultPanel" hidden>
          <div class="result-icon" data-role="resultIcon"><svg><use href="#i-check"/></svg></div>
          <div class="result-copy">
            <span data-i18n="resultTitle">Conversion Results</span>
            <strong data-role="resultSummary"></strong>
            <small data-role="resultOutput"></small>
            <small class="result-failures" data-role="resultFailures"></small>
          </div>
          <button class="btn" type="button" data-role="openOutput"><svg><use href="#i-arrow-out"/></svg><span data-i18n="openOutputFolder">Open Output Folder</span></button>
        </section>

        <footer class="actionbar">
          <div class="progress-wrap">
            <div class="progress-track"><div class="progress-fill" data-role="progressBar"></div></div>
            <span class="status-text" data-role="statusText">Ready</span>
          </div>
          <div class="action-buttons">
            <button class="btn" type="button" data-role="cancel" disabled data-i18n="cancel">Cancel</button>
            <button class="btn primary large" type="button" data-role="convert" disabled data-i18n="startConversion">Start Conversion</button>
          </div>
        </footer>
      </main>
    </section>
  </template>

  <script src="./i18n.js"></script>
  <script src="./app.js"></script>
</body>
</html>
